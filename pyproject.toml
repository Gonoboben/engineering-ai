[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-ai"
version = "0.1.0"
description = "Local-first auditable engineering AI control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
