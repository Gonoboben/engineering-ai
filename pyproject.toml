[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-ai"
version = "0.1.0"
description = "Local-first auditable engineering AI control plane"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
