name: Gate 026 install validation

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/gate026_*"
      - ".github/workflows/gate026-install.yml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  measure-install-toolchain:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact revision
        shell: bash
        if: runner.os != 'Windows'
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Verify exact revision on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ github.event.pull_request.head.sha }}"
          Write-Host "expected=$expected"
          Write-Host "actual=$actual"
          if ($actual -ne $expected) { throw "exact PR head mismatch" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure current install toolchain candidate
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Print measured toolchain
        run: python scripts/gate026_install_probe.py
