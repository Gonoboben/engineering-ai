name: Gate 036 real connected-project controlled-use acceptance

on:
  pull_request:
    paths:
      - "scripts/gate036_real_connected_project_controlled_use.py"
      - "tests/test_gate036_real_connected_project_controlled_use.py"
      - "docs/evidence/gate036/**"
      - "STATUS.md"
      - "ROADMAP.md"
      - "CHRONOLOGY.md"
      - ".github/workflows/gate036-connected-project-controlled-use.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Gate 036 deterministic evidence-contract regression
        run: python -m unittest tests.test_gate036_real_connected_project_controlled_use
      - name: Contract self-test is synthetic only
        run: python scripts/gate036_real_connected_project_controlled_use.py --contract-self-test
