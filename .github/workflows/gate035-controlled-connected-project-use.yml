name: Gate 035 controlled connected-project use opening contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-project-contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact revision
        shell: bash
        if: runner.os != 'Windows'
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Verify exact revision on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          Write-Host "expected=$expected"
          Write-Host "actual=$actual"
          if ($actual -ne $expected) { throw "exact revision mismatch" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gate 035 opening harness
        run: python scripts/gate035_controlled_connected_projects.py

      - name: Run Gate 035 contract tests
        run: python -m unittest tests.test_gate035_controlled_connected_projects
